name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ==========================================
  # 1. ТЕСТЫ (на всех 3 ОС)
  # ==========================================
  test:
    name: 🧪 Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 🐧 Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
            libosmesa6 mesa-utils libxcb-shape0 libxcb-cursor0

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: ✅ Verify imports
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import PySide6, PIL, pillow_heif, pypdfium2, rawpy, cv2, mutagen; print('All imports OK')"

      - name: 🧪 Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -q

  # ==========================================
  # 2. СБОРКА + УПАКОВКА (на всех 3 ОС)
  # ==========================================
  build:
    name: 🏗️ Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: DeepDublicator-Windows
            artifact_ext: zip
            separator: ';'
            pyinstaller_icon: '--icon "assets/logo.ico"'
          - os: ubuntu-latest
            artifact_name: DeepDublicator-Linux
            artifact_ext: tar.gz
            separator: ':'
            pyinstaller_icon: ''
          - os: macos-latest
            artifact_name: DeepDublicator-macOS
            artifact_ext: zip
            separator: ':'
            pyinstaller_icon: '--icon "assets/logo.icns"'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 🏷️ Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(awk -F'"' '/^APP_VERSION = /{print $2; exit}' utils/config.py)
          if [ -z "$VERSION" ]; then
            echo "ERROR: APP_VERSION not found in utils/config.py" >&2
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION"

      - name: 🐧 Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
            libosmesa6 mesa-utils libxcb-shape0 libxcb-cursor0

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 🍎 Generate .icns for macOS
        if: runner.os == 'macOS'
        run: |
          ICONSET=assets/logo.iconset
          mkdir -p "$ICONSET"
          for size in 16 32 64 128 256 512; do
            sips -z $size $size assets/logo.png --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            sips -z $((size * 2)) $((size * 2)) assets/logo.png --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o assets/logo.icns

      - name: 🏗️ Build with PyInstaller
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --noupx \
            --name "DeepDublicator" \
            ${{ matrix.pyinstaller_icon }} \
            --hidden-import "PIL" \
            --hidden-import "pillow_heif" \
            --hidden-import "pypdfium2" \
            --hidden-import "rawpy" \
            --hidden-import "cv2" \
            --hidden-import "mutagen" \
            --hidden-import "cli.cli" \
            --add-data "assets${{ matrix.separator }}assets" \
            --add-data "cli${{ matrix.separator }}cli" \
            --add-data "core${{ matrix.separator }}core" \
            --add-data "gui${{ matrix.separator }}gui" \
            --add-data "utils${{ matrix.separator }}utils" \
            main.py

      - name: 🗜️ Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/DeepDublicator" -DestinationPath "${{ matrix.artifact_name }}-v${{ steps.version.outputs.APP_VERSION }}.zip"

      - name: 🗜️ Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czvf "${{ matrix.artifact_name }}-v${{ steps.version.outputs.APP_VERSION }}.tar.gz" -C dist DeepDublicator

      - name: 🗜️ Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/DeepDublicator.app "${{ matrix.artifact_name }}-v${{ steps.version.outputs.APP_VERSION }}.zip"

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-v${{ steps.version.outputs.APP_VERSION }}
          path: ${{ matrix.artifact_name }}-v${{ steps.version.outputs.APP_VERSION }}.${{ matrix.artifact_ext }}
          retention-days: 7

  # ==========================================
  # 3. РЕЛИЗ (только при пуше тега v*)
  # ==========================================
  release:
    name: 🚀 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 🚀 Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          name: Deep Dublicator ${{ github.ref_name }}
          body: |
            ## Deep Dublicator ${{ github.ref_name }}

            Автоматическая сборка приложения для Windows, Linux и macOS.

            ### Установка

            **Windows**
            1. Распакуйте `DeepDublicator-Windows-*.zip`
            2. Запустите `DeepDublicator.exe`

            **Linux**
            ```bash
            tar -xzvf DeepDublicator-Linux-*.tar.gz
            cd DeepDublicator
            chmod +x DeepDublicator
            ./DeepDublicator