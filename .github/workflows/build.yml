name: Build & Test

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pyinstaller_args: --icon "assets/logo.ico" --add-data "assets;assets" --add-data "cli;cli" --add-data "core;core" --add-data "gui;gui" --add-data "utils;utils"
          - os: ubuntu-latest
            pyinstaller_args: --add-data "assets:assets" --add-data "cli:cli" --add-data "core:core" --add-data "gui:gui" --add-data "utils:utils"
          - os: macos-latest
            pyinstaller_args: --add-data "assets:assets" --add-data "cli:cli" --add-data "core:core" --add-data "gui:gui" --add-data "utils:utils"

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🏷️ Extract Version
      id: get_version
      shell: bash
      run: |
        VERSION=$(grep '^APP_VERSION = ' utils/config.py | cut -d '"' -f 2)
        echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
        echo "Собираем версию: $VERSION"

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: 🐧 Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libegl1 libgl1 libxkbcommon-x11-0 \
          libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
          libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
          libosmesa6 mesa-utils libxcb-shape0 libxcb-cursor0

    - name: 📦 Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install pyinstaller

    - name: ✅ Verify imports
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python -c "import PySide6; import PIL; import pillow_heif; import pypdfium2; import rawpy; import cv2; import mutagen; print('Все зависимости импортированы успешно')"

    - name: 🧪 Run tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        pytest tests/ -q

    - name: 🏗️ Build with PyInstaller
      run: |
        python -m PyInstaller --noconfirm --onedir --windowed --name "DeepDublicator" \
          --hidden-import "PIL" \
          --hidden-import "pillow_heif" \
          --hidden-import "pypdfium2" \
          --hidden-import "rawpy" \
          --hidden-import "cv2" \
          --hidden-import "mutagen" \
          ${{ matrix.pyinstaller_args }} \
          main.py

    - name: 🗜️ Zip Artifact (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cd dist
        powershell Compress-Archive -Path DeepDublicator -DestinationPath "../DeepDublicator-Windows-v${{ env.APP_VERSION }}.zip"

    - name: 🗜️ Tar Artifact (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cd dist
        tar -czvf ../DeepDublicator-Linux-v${{ env.APP_VERSION }}.tar.gz DeepDublicator

    - name: 🗜️ Zip Artifact (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        cd dist
        zip -r ../DeepDublicator-macOS-v${{ env.APP_VERSION }}.zip DeepDublicator.app

    - name: 📤 Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DeepDublicator-${{ matrix.os }}-v${{ env.APP_VERSION }}
        path: DeepDublicator-*-v${{ env.APP_VERSION }}.*
        retention-days: 7

    - name: 🚀 Publish to GitHub Releases
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: DeepDublicator-*-v${{ env.APP_VERSION }}.*
        name: Release v${{ env.APP_VERSION }}
        body: |
          ## Deep Dublicator v${{ env.APP_VERSION }}
          
          Автоматическая сборка приложения для Windows, Linux и macOS.
          
          ### Что нового:
          - Автоматические тесты пройдены успешно.
          - Сборка с использованием PyInstaller.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}